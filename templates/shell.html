<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06070f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Family Vault</title>
  <link rel="stylesheet" href="/static/app.css?v=20260924-export-vault">
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script>
    (function () {
      var stored = localStorage.getItem('familyVaultTheme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <main id="app" aria-live="polite">
    <section id="loginView" class="auth-card">
      <p class="eyebrow">PRIVATE FAMILY ARCHIVE</p>
      <h1>Family Vault</h1>
      <p>Sign in to explore and preserve your shared family history.</p>
      <form id="loginForm" class="form-stack">
        <label>Username<input name="username" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
        <p id="loginError" class="error" hidden></p>
      </form>
    </section>

    <section id="vaultView" hidden>
      <header class="topbar">
        <div><p class="eyebrow">PRIVATE FAMILY ARCHIVE</p><h1>Family Vault</h1></div>
        <div class="header-actions">
          <span id="userName"></span>
          <label class="header-search">Search<input id="searchInput" type="search" placeholder="Find a family member"></label>
          <button id="themeToggle" class="icon-toggle" type="button" aria-label="Toggle light and dark theme">🌙</button>
          <a class="button-link secondary" href="/help">Help &amp; guide</a>
          <button id="reviewButton" class="secondary" hidden>Review proposals</button>
          <button id="usersButton" class="secondary" hidden>Manage users</button>
          <button id="logoutButton" class="secondary">Sign out</button>
        </div>
      </header>
      <section class="controls">
        <label class="timeline-label">View up to <input id="yearSlider" type="range"><strong id="yearLabel"></strong></label>
        <div class="view-toggle" role="group" aria-label="Tree view mode">
          <span>View:</span>
          <button id="organicView" class="view-mode active" type="button" aria-pressed="true">Organic</button>
          <button id="classicView" class="view-mode" type="button" aria-pressed="false">Classic Tree</button>
        </div>
        <div class="relative inline-block text-left" id="exportMenuContainer">
          <button id="exportDropdownBtn" type="button" aria-expanded="false" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded text-xs font-medium shadow flex items-center space-x-1">
            <span>Export Options</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>
          <div id="exportDropdownMenu" class="hidden absolute right-0 mt-3 w-64 rounded-xl bg-slate-900/95 border border-slate-800 shadow-2xl backdrop-blur-md p-3.5 space-y-4 z-50">
            <div class="space-y-1.5" role="menu">
              <div class="space-y-1.5">
                <div class="px-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-2">Full Tree Archive</div>
                <div class="flex flex-col space-y-1">
                  <button id="existingGedcomBtn" class="w-full text-left block px-3 py-2 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/80 rounded-lg transition-colors duration-150" role="menuitem">Download Schema (.GED)</button>
                  <button id="svgExportBtn" onclick="triggerSvgExport()" class="w-full text-left block px-3 py-2 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/80 rounded-lg transition-colors duration-150" role="menuitem">Download Vector (.SVG)</button>
                  <button id="pngExportBtn" onclick="triggerPngExport()" class="w-full text-left block px-3 py-2 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/80 rounded-lg transition-colors duration-150" role="menuitem">Download High-Res Image (.PNG)</button>
                  <button id="pumlExportBtn" class="w-full text-left block px-3 py-2 text-xs font-medium text-slate-300 hover:text-white hover:bg-slate-800/80 rounded-lg transition-colors duration-150" role="menuitem">Download Structure Text (.PUML)</button>
                </div>
              </div>
              <div class="border-t border-slate-800/80 my-2 mx-1"></div>
              <div class="space-y-1.5">
                <div class="px-2 text-[10px] font-bold text-indigo-400 uppercase tracking-widest block mb-2">Isolated Lineage Trail</div>
                <div class="flex flex-col space-y-1">
                  <button onclick="triggerLineageSnapshotExport('png')" class="w-full text-left block px-3 py-2 text-xs font-medium text-indigo-300 hover:text-white hover:bg-indigo-950/40 rounded-lg transition-colors duration-150" role="menuitem">Snapshot: Clean Image (.PNG)</button>
                  <button onclick="triggerLineageSnapshotExport('svg')" class="w-full text-left block px-3 py-2 text-xs font-medium text-indigo-300 hover:text-white hover:bg-indigo-950/40 rounded-lg transition-colors duration-150" role="menuitem">Snapshot: Vector Graphic (.SVG)</button>
                  <button onclick="triggerLineageSnapshotExport('puml')" class="w-full text-left block px-3 py-2 text-xs font-medium text-indigo-300 hover:text-white hover:bg-indigo-950/40 rounded-lg transition-colors duration-150" role="menuitem">Snapshot: Diagram Text (.PUML)</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button id="resetView" class="secondary">Reset view</button>
        <label class="edge-style-label">Edges
          <select id="edgeStyleSelect" aria-label="Edge style">
            <option value="classic">Classic</option>
            <option value="moving-dots">Moving dots</option>
          </select>
        </label>
        <button id="addButton">+ Add family member</button>
        <section id="status" class="status" hidden></section>
      </section>
      <section id="treeViewport" aria-label="Interactive family knowledge graph">
        <div id="treeCanvas"></div>
      </section>
    </section>
  </main>

  <aside id="sidePanel" class="side-panel" hidden aria-label="Family member panel"><button class="close-sheet" data-close="sidePanel" aria-label="Close">×</button><div id="sidePanelContent"></div></aside>
  <aside id="reviewSheet" class="sheet" hidden aria-label="Proposal review"><div class="sheet-panel"><span class="sheet-handle" aria-hidden="true"></span><button class="close-sheet" data-close="reviewSheet" aria-label="Close">×</button><div id="reviewContent"></div></div></aside>
  <div id="overlayBackdrop" class="side-panel-backdrop" hidden></div>
  <script src="/static/app.js?v=20260925-spouse-ancestor-lineage-v2"></script>
</body>
</html>
